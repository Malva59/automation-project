name: Genshin & Star Rail Codes

on:
  workflow_dispatch:

concurrency:
  group: codes-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # RÉCUPÉRER LE PROJET
      # ==========================================

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # CONFIGURER GIT
      # ==========================================

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================
      # CALCULER LES HORAIRES
      # ==========================================

      - name: Préparer le statut
        run: |

          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEXT_SEARCH_AT=$(date -u -d "+5 minutes" +"%Y-%m-%dT%H:%M:%SZ")

          echo "STARTED_AT=$STARTED_AT" >> "$GITHUB_ENV"
          echo "NEXT_SEARCH_AT=$NEXT_SEARCH_AT" >> "$GITHUB_ENV"

          cat > status.json << EOF
          {
            "status": "searching",
            "started_at": "$STARTED_AT",
            "next_search_at": "$NEXT_SEARCH_AT"
          }
          EOF

          git add status.json
          git commit -m "Bot status: searching"
          git push origin main


      # ==========================================
      # INSTALLER PYTHON
      # ==========================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # INSTALLER LES DÉPENDANCES
      # ==========================================

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium


      # ==========================================
      # LANCER LE SCRAPER / BOT
      # ==========================================

      - name: Lancer le bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python bot.py


      # ==========================================
      # SAUVEGARDER LES CODES
      # ==========================================

      - name: Sauvegarder les codes connus
        run: |

          git add .

          git diff --cached --quiet || git commit -m "Update known Genshin and Star Rail codes"

          git pull --rebase origin main

          git push origin main


      # ==========================================
      # GARANTIR 30 SECONDES DE RECHERCHE
      # ==========================================

      - name: Maintenir le statut recherche
        if: always()
        run: |

          NOW=$(date +%s)
          START=$(date -d "$STARTED_AT" +%s)

          ELAPSED=$((NOW - START))

          if [ "$ELAPSED" -lt 30 ]; then

            WAIT=$((30 - ELAPSED))

            echo "Recherche terminée."
            echo "Maintien du statut recherche pendant $WAIT secondes."

            sleep "$WAIT"

          fi


      # ==========================================
      # STATUT : ATTENTE
      # ==========================================

      - name: Statut - Recherche terminée
        if: always()
        run: |

          COMPLETED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > status.json << EOF
          {
            "status": "waiting",
            "started_at": "$STARTED_AT",
            "completed_at": "$COMPLETED_AT",
            "next_search_at": "$NEXT_SEARCH_AT"
          }
          EOF

          git add status.json

          git diff --cached --quiet || git commit -m "Bot status: waiting"

          git pull --rebase origin main

          git push origin main


      # ==========================================
      # FIN
      # ==========================================

      - name: Terminé
        if: always()
        run: |
          echo "========================================"
          echo "Recherche terminée."
          echo "Prochaine recherche : $NEXT_SEARCH_AT"
          echo "========================================"
