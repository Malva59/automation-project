name: Test Crimson Witch

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Tester Crimson Witch
        run: python test_scraper.py

      - name: Sauvegarder les codes connus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add known_codes.json

          if git diff --cached --quiet; then
            echo "Aucun nouveau code à sauvegarder."
          else
            git commit -m "Update known Genshin codes"
            git push
          fi
